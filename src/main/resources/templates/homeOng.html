<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Wave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
<body>

    <div id="header-bg">
        <header id="header">
          <a id="logo" href="/">BLUE WAVE</a>
          <nav id="nav">
            <button id="btn-mobile">
              <span id="hambuger"></span>
            </button>
           
            <ul id="menu">
              <li><a href="/vagas/listaVaga">Lista Vagas</a></li>
              <li><a href="/vagas/homeOng">Cadastra Vaga</a></li>
              
            </ul>
          </nav>
        </header>
      </div>

      <div>

        <form onsubmit="vaga(event)">
          <label for="nome" >Nome Da Vaga</label><br>
          <input type="text" id="nome" placeholder="Nome"><br>
          <label for="quatidade" >quantidade de vagas</label><br>
          <input type="text" id="quatidade" placeholder="quatidade"><br>

          <label for="quatidade" >Descrição da vagas</label><br>
          <input type="text" id="desc" placeholder="descrição"><br>
          <button type="submit">Cadastra Vaga</button>
        </form>
      </div>
    
    
</body>
<script>
  async function vaga(event) {
    event.preventDefault();

    const nome = document.getElementById("nome").value;
    const quantidade = document.getElementById("quatidade").value;
    const descricao = document.getElementById("desc").value;

    const vagaData = {
      nome: nome,
      quantidade: quantidade,
      descri: descricao
    };

    try {
      const response = await fetch("http://localhost:8080/vagas/homeOng", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(vagaData)
      });

      if (response.ok) {
        alert("Vaga cadastrada com sucesso!");
      } else {
        alert("Erro ao cadastrar vaga.");
      }
    } catch (error) {
      console.error("Erro na requisição:", error);
      alert("Erro na requisição.");
    }
  }
</script>
</html>
