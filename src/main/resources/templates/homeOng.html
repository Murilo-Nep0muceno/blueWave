<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Wave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Roboto', sans-serif;
      }
  
      body {
        height: 100vh;
        background-color: #f1f1f1;
      }
  
      nav.menu-lateral {
        width: 80px;
        height: 100%;
        background-color: #00A8FF;
        padding: 40px 0 40px 1%;
        box-shadow: 3px 0 0 #003366;
        position: fixed;
        top: 0;
        left: 0;
        overflow: hidden;
        transition: 0.2s;
      }
  
      nav.menu-lateral:hover {
        width: 300px;
      }
  
      .title {
        display: flex;
        align-items: center;
      }
  
      .title h1 {
        display: none;
        margin-left: 10px;
        color: white;
      }
  
      nav.menu-lateral:hover .title h1 {
        display: block;
      }
  
      ul {
        list-style: none;
        padding: 0;
      }
  
      ul li.item-menu {
        margin-bottom: 10px;
      }
  
      ul li.item-menu:hover {
        background-color: #003366;
      }
  
      ul li.item-menu a {
        color: white;
        text-decoration: none;
        font-size: 18px;
        padding: 20px 4%;
        display: flex;
        align-items: center;
      }
  
      ul li.item-menu a .icon > i {
        font-size: 30px;
      }
  
      ul li.item-menu a .txt-link {
        margin-left: 20px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.3s;
      }
  
      nav.menu-lateral:hover .txt-link {
        opacity: 1;
      }
  
      .conteudo {
        margin-left: 80px;
        padding: 20px;
        transition: margin-left 0.2s;
      }
  
      nav.menu-lateral:hover ~ .conteudo {
        margin-left: 300px;
      }
  
      #header-bg {
        background-color: #003366;
        padding: 10px 20px;
      }
  
      #header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
      }
  
      #logo {
        font-size: 24px;
        color: white;
        text-decoration: none;
        font-weight: bold;
      }
  
      #nav ul {
        display: flex;
        gap: 20px;
      }
  
      #nav ul li {
        list-style: none;
      }
  
      #nav ul li a {
        color: white;
        text-decoration: none;
        font-size: 16px;
      }
  
      form {
    margin: 40px auto;
    background-color: white;
    padding: 30px;
    max-width: 500px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    border-radius: 8px;
    position: relative;
    top: 50%;           
    transform: translateY(10%);
}
  
      form label {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
        color: #003366;
      }
  
      form input, textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
  
      form button {
    display: block;         
    margin: 20px auto 0;    
    padding: 10px 20px;
    background-color: #00A8FF;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
}


textarea {
  margin: 15px 0;
  height: 200px
}

form button:hover {
    background-color: #007acc;
}

    </style>
<body>    
  <nav class="menu-lateral">
    <div class="title">
      <img th:src="@{/css/images/logo_blue_white.png}" width="50px" height="50px" alt="">
      <h1>Blue Wave</h1>
    </div>
    <ul>
      <li class="item-menu">
        <a href="/vagas/listaVaga">
          <span class="icon"><i class="bi bi-briefcase"></i></span>
          <span class="txt-link">Listar Vagas</span>
        </a>
      </li>
      <li class="item-menu">
        <a href="/vagas/homeOng">
          <span class="icon"><i class="bi bi-person-add"></i></span>
          <span class="txt-link">Cadastrar Vagas</span>
        </a>
      </li>
      <li class="item-menu">
        <a href="#">
          <span class="icon"><i class="bi bi-megaphone"></i></span>
          <span class="txt-link">Reports</span>
        </a>
      </li>
    </ul>
  </nav>
  <div class="conteudo">
    <div id="header-bg">
      <header id="header">
        <a id="logo" href="/">Painel de Controle -- Cadastrar Vagas</a>
      </header>
    </div>
  
    <form onsubmit="vaga(event)">
      <label for="nome">Nome da Vaga</label>
      <input type="text" id="nome" placeholder="Nome da vaga" required>
  
      <label for="quantidade">Quantidade de Vagas</label>
      <input type="number" id="quantidade" placeholder="Quantidade" required>
  
      <label for="desc">Descrição da Vaga</label>
      <textarea id="desc" placeholder="Descrição"></textarea>
  
      <label for="data">Data da Vaga</label>
      <input type="date" id="data" required>
  
      <button type="submit">Cadastrar Vaga</button>
    </form>
  </div>
  
  <script>
    async function vaga(event) {
      event.preventDefault();
  
      const nome = document.getElementById("nome").value;
      const quantidade = parseInt(document.getElementById("quantidade").value, 10);
      const descricao = document.getElementById("desc").value;
      const data = document.getElementById("data").value;
  
      const vagaData = {
        nome: nome,
        quantidade: quantidade,
        descri: descricao,
        data: data
      };
  
      try {
        const response = await fetch("http://localhost:8080/vagas/homeOng", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(vagaData)
        });
  
        if (response.ok) {
          alert("Vaga cadastrada com sucesso!");
          // opcional: resetar formulário
          document.querySelector('form').reset();
        } else {
          alert("Erro ao cadastrar vaga.");
        }
      } catch (error) {
        console.error("Erro na requisição:", error);
        alert("Erro na requisição.");
      }
    }
  </script>
  
  </body>
</html>
