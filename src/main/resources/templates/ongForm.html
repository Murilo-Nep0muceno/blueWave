<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Wave - Cadastro ONG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('../static/css/images/praia1.jpeg') repeat;
            z-index: -1;
        }

        #header-bg {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }

        #header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0ea5e9;
            text-decoration: none;
            letter-spacing: 1px;
        }

        #nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        #nav a {
            color: #0ea5e9;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }

        #nav a:hover {
            background: #f1f5f9;
            color: #0284c7;
            transform: translateY(-2px);
        }

        #btn-mobile {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
        }

        #hambuger {
            display: block;
            width: 25px;
            height: 2px;
            background: #0ea5e9;
            position: relative;
        }

        #hambuger::before,
        #hambuger::after {
            content: '';
            display: block;
            width: 25px;
            height: 2px;
            background: #0ea5e9;
            position: absolute;
        }

        #hambuger::before {
            top: -8px;
        }

        #hambuger::after {
            bottom: -8px;
        }

        /* Container do formulário */
        #form-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem 2rem;
            min-height: calc(100vh - 80px);
        }

        #form-cadastro {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 3rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #form-cadastro h1 {
            color: #1e293b;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 2rem;
            text-align: center;
        }

        #form-cadastro .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .label {
            display: block;
            color: #374151;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
            font-family: 'Inter', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }

        input::placeholder {
            color: #9ca3af;
        }

        .error {
            display: none;
            background: #fee2e2;
            color: #dc2626;
            padding: 0.5rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            text-align: center;
        }

        .error.show {
            display: block;
        }

        .success {
            display: none;
            background: #dcfce7;
            color: #059669;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            text-align: center;
        }

        .success.show {
            display: block;
        }

        /* Alerta de erro geral */
        .alert-error {
            display: none;
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 500;
        }

        .alert-error.show {
            display: block;
        }

        #btn-cadastro {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        #btn-cadastro:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(14, 165, 233, 0.3);
        }

        #btn-cadastro:active {
            transform: translateY(0);
        }

        #btn-cadastro:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Loading spinner */
        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0ea5e9;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Validação visual */
        input.invalid {
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        input.valid {
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
        }

        /* Responsivo */
        @media (max-width: 768px) {
            #nav ul {
                display: none;
            }

            #btn-mobile {
                display: block;
            }

            #header {
                padding: 1rem;
            }

            #form-container {
                padding: 2rem 1rem;
            }

            #form-cadastro {
                padding: 2rem 1.5rem;
            }

            #logo {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            #form-cadastro {
                padding: 1.5rem 1rem;
            }

            #form-cadastro h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div id="header-bg">
    <header id="header">
        <a id="logo" href="/">BLUE WAVE</a>
        <nav id="nav">
            <button id="btn-mobile">
                <span id="hambuger"></span>
            </button>

            <ul id="menu">
                <li><a href="/quemSomoss">Quem Somos?</a></li>
                <li><a href="/ongForm">Sou uma ONG</a></li>
                <li><a href="/voluntarioForm">Quero ser voluntário</a></li>
                <li><a href="/login">Entrar</a></li>
            </ul>
        </nav>
    </header>
</div>

<section id="form-container">
    <form id="form-cadastro">
        <h1>Cadastro de ONG BlueWave</h1>

        <div id="alert-error" class="alert-error">
            <strong>Erro!</strong> <span id="error-message">Ocorreu um erro ao processar sua solicitação.</span>
        </div>

        <div id="success-message" class="success">
            ONG cadastrada com sucesso! Você será redirecionado em breve...
        </div>

        <div class="form-group">
            <label id="error_nome" class="error">Nome da ONG deve ter pelo menos 3 caracteres</label>
            <label class="label" for="nome">Nome da ONG</label>
            <input type="text" id="nome" name="nome" placeholder="Digite o nome da ONG" required>
        </div>

        <div class="form-group">
            <label id="error_cnpj" class="error">CNPJ deve ter exatamente 14 dígitos</label>
            <label class="label" for="cnpj">CNPJ</label>
            <input type="text" id="cnpj" name="cnpj" placeholder="Digite apenas os números: 12345678000100" required>
        </div>

        <div class="form-group">
            <label id="error_email" class="error">Email inválido</label>
            <label class="label" for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Digite o e-mail da ONG" required>
        </div>

        <div class="form-group">
            <label id="error_senha" class="error">Senha deve ter pelo menos 8 caracteres</label>
            <label class="label" for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Senha com no mínimo 8 caracteres" required>
        </div>

        <div class="form-group">
            <label id="error_senhaConfirmar" class="error">Senhas não coincidem</label>
            <label class="label" for="senhaConfirmar">Confirme sua Senha</label>
            <input type="password" id="senhaConfirmar" name="senhaConfirmar" placeholder="Confirme sua senha" required>
        </div>

        <div class="form-group">
            <label id="error_telefone" class="error">Telefone deve ter 10 ou 11 dígitos</label>
            <label class="label" for="telefone">Telefone</label>
            <input type="text" id="telefone" name="telefone" placeholder="Digite apenas os números: 11987654321" required>
        </div>

        <div class="form-group">
            <label id="error_cep" class="error">CEP deve ter exatamente 8 dígitos</label>
            <label class="label" for="cep">CEP</label>
            <input type="text" id="cep" name="cep" placeholder="Digite apenas os números: 01234567" required>
        </div>

        <div class="form-group">
            <button type="submit" id="btn-cadastro">Cadastrar</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Cadastrando ONG...</p>
        </div>
    </form>
</section>

<script>
    // Função para mostrar alerta de erro
    function mostrarAlertaErro(mensagem) {
        const alertError = document.getElementById('alert-error');
        const errorMessage = document.getElementById('error-message');
        errorMessage.textContent = mensagem;
        alertError.classList.add('show');

        // Auto-ocultar após 5 segundos
        setTimeout(() => {
            alertError.classList.remove('show');
        }, 5000);
    }

    // Função para limpar apenas números
    function somenteNumeros(valor) {
        return valor.replace(/\D/g, '');
    }

    // Funções de validação
    function validarNome() {
        const nome = document.getElementById('nome');
        const error = document.getElementById('error_nome');

        if (nome.value.trim().length < 3) {
            mostrarErro(error, nome);
            return false;
        } else {
            esconderErro(error, nome);
            return true;
        }
    }

    function validarCnpj() {
        const cnpj = document.getElementById('cnpj');
        const error = document.getElementById('error_cnpj');
        const cnpjLimpo = somenteNumeros(cnpj.value);

        if (cnpjLimpo.length !== 14) {
            mostrarErro(error, cnpj);
            return false;
        } else {
            esconderErro(error, cnpj);
            return true;
        }
    }

    function validarEmail() {
        const email = document.getElementById('email');
        const error = document.getElementById('error_email');
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailRegex.test(email.value)) {
            mostrarErro(error, email);
            return false;
        } else {
            esconderErro(error, email);
            return true;
        }
    }

    function validarSenha() {
        const senha = document.getElementById('senha');
        const error = document.getElementById('error_senha');

        if (senha.value.length < 8) {
            mostrarErro(error, senha);
            return false;
        } else {
            esconderErro(error, senha);
            return true;
        }
    }

    function validarConfirmacaoSenha() {
        const senha = document.getElementById('senha');
        const senhaConfirmar = document.getElementById('senhaConfirmar');
        const error = document.getElementById('error_senhaConfirmar');

        if (senha.value !== senhaConfirmar.value) {
            mostrarErro(error, senhaConfirmar);
            return false;
        } else {
            esconderErro(error, senhaConfirmar);
            return true;
        }
    }

    function validarTelefone() {
        const telefone = document.getElementById('telefone');
        const error = document.getElementById('error_telefone');
        const telefoneLimpo = somenteNumeros(telefone.value);

        if (telefoneLimpo.length < 10 || telefoneLimpo.length > 11) {
            mostrarErro(error, telefone);
            return false;
        } else {
            esconderErro(error, telefone);
            return true;
        }
    }

    function validarCep() {
        const cep = document.getElementById('cep');
        const error = document.getElementById('error_cep');
        const cepLimpo = somenteNumeros(cep.value);

        if (cepLimpo.length !== 8) {
            mostrarErro(error, cep);
            return false;
        } else {
            esconderErro(error, cep);
            return true;
        }
    }

    function mostrarErro(errorElement, inputElement) {
        errorElement.classList.add('show');
        inputElement.classList.add('invalid');
        inputElement.classList.remove('valid');
    }

    function esconderErro(errorElement, inputElement) {
        errorElement.classList.remove('show');
        inputElement.classList.remove('invalid');
        inputElement.classList.add('valid');
    }

    // Event listeners para validação em tempo real
    document.getElementById('nome').addEventListener('blur', validarNome);
    document.getElementById('cnpj').addEventListener('blur', validarCnpj);
    document.getElementById('email').addEventListener('blur', validarEmail);
    document.getElementById('senha').addEventListener('blur', validarSenha);
    document.getElementById('senhaConfirmar').addEventListener('blur', validarConfirmacaoSenha);
    document.getElementById('telefone').addEventListener('blur', validarTelefone);
    document.getElementById('cep').addEventListener('blur', validarCep);

    // Restringir entrada apenas para números nos campos específicos
    function restringirNumeros(inputId) {
        document.getElementById(inputId).addEventListener('input', function(e) {
            const valor = somenteNumeros(e.target.value);
            e.target.value = valor;
        });
    }

    // Aplicar restrição de números
    restringirNumeros('cnpj');
    restringirNumeros('telefone');
    restringirNumeros('cep');

    // Limitar caracteres por campo
    document.getElementById('cnpj').addEventListener('input', function(e) {
        if (e.target.value.length > 14) {
            e.target.value = e.target.value.slice(0, 14);
        }
    });

    document.getElementById('telefone').addEventListener('input', function(e) {
        if (e.target.value.length > 11) {
            e.target.value = e.target.value.slice(0, 11);
        }
    });

    document.getElementById('cep').addEventListener('input', function(e) {
        if (e.target.value.length > 8) {
            e.target.value = e.target.value.slice(0, 8);
        }
    });

    // Função principal de envio do formulário
    document.getElementById('form-cadastro').addEventListener('submit', async function(e) {
        e.preventDefault();

        // Esconder alertas anteriores
        document.getElementById('alert-error').classList.remove('show');
        document.getElementById('success-message').classList.remove('show');

        // Validar todos os campos
        const validacoes = [
            validarNome(),
            validarCnpj(),
            validarEmail(),
            validarSenha(),
            validarConfirmacaoSenha(),
            validarTelefone(),
            validarCep()
        ];

        const todosValidos = validacoes.every(v => v === true);

        if (!todosValidos) {
            mostrarAlertaErro('Por favor, corrija os erros no formulário antes de continuar.');
            return;
        }

        // Preparar dados para envio (apenas números para CNPJ, telefone e CEP)
        const formData = {
            nome: document.getElementById('nome').value.trim(),
            cnpj: somenteNumeros(document.getElementById('cnpj').value),
            email: document.getElementById('email').value.trim(),
            senha: document.getElementById('senha').value,
            telefone: somenteNumeros(document.getElementById('telefone').value),
            cep: somenteNumeros(document.getElementById('cep').value)
        };

        // Mostrar loading
        document.getElementById('loading').style.display = 'block';
        document.getElementById('btn-cadastro').disabled = true;

        try {
            const response = await fetch('/ongForm', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            });

            const responseData = await response.json();

            if (response.ok) {
                console.log('ONG cadastrada:', responseData);

                // Mostrar mensagem de sucesso
                document.getElementById('success-message').classList.add('show');
                document.getElementById('form-cadastro').reset();

                // Remover classes de validação
                document.querySelectorAll('input').forEach(input => {
                    input.classList.remove('valid', 'invalid');
                });

                // Redirecionar após 3 segundos
                setTimeout(() => {
                    window.location.href = '/login';
                }, 3000);

            } else {
                let mensagemErro = 'Erro ao cadastrar ONG';

                if (response.status === 400) {
                    // Erros de validação
                    if (responseData.nome) mensagemErro = responseData.nome;
                    else if (responseData.cnpj) mensagemErro = responseData.cnpj;
                    else if (responseData.email) mensagemErro = responseData.email;
                    else if (responseData.senha) mensagemErro = responseData.senha;
                    else if (responseData.telefone) mensagemErro = responseData.telefone;
                    else if (responseData.cep) mensagemErro = responseData.cep;
                    else mensagemErro = 'Dados inválidos. Verifique os campos preenchidos.';
                } else if (response.status === 409) {
                    // Conflito (CNPJ ou email já existe)
                    mensagemErro = responseData.message || 'CNPJ ou email já cadastrado no sistema';
                } else if (response.status === 500) {
                    mensagemErro = 'Erro interno do servidor. Tente novamente mais tarde.';
                } else {
                    mensagemErro = responseData.message || 'Erro desconhecido ao cadastrar ONG';
                }

                mostrarAlertaErro(mensagemErro);
            }

        } catch (error) {
            console.error('Erro de conexão:', error);
            mostrarAlertaErro('Erro de conexão. Verifique sua internet e tente novamente.');
        } finally {
            // Esconder loading
            document.getElementById('loading').style.display = 'none';
            document.getElementById('btn-cadastro').disabled = false;
        }
    });

    // Menu mobile
    document.getElementById('btn-mobile').addEventListener('click', function() {
        document.getElementById('menu').classList.toggle('active');
    });
</script>
</body>
</html>
